<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Pokédex</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 20px; display: grid; place-items: center; background: linear-gradient(140deg, #10131a, #203c63); color: #202938; font-family: Arial, sans-serif; }
        main { width: min(420px, 100%); padding: 34px; border-radius: 18px; background: white; box-shadow: 0 18px 50px #0004; }
        .marca { color: #c62828; font-weight: bold; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin-bottom: 8px; }
        .intro { color: #64748b; }
        label { display: block; margin: 18px 0 7px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        input:focus { outline: 3px solid #dbeafe; border-color: #2563eb; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #d62828; color: white; font: inherit; font-weight: bold; cursor: pointer; }
        .error { padding: 12px; border-radius: 8px; background: #fff1f2; color: #b42318; }
    </style>
</head>
<body>
<main>
    <p class="marca">Pokédex</p>
    <h1>Iniciar sesión</h1>
    <p class="intro">Ingresa a tu cuenta de entrenador o jugador.</p>
    {% if form.errors %}
        <p class="error" role="alert">Usuario o contraseña incorrectos. Intenta de nuevo.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <label for="id_username">Nombre de usuario</label>
        <input id="id_username" type="text" name="username" autocomplete="username" required autofocus>
        <label for="id_password">Contraseña</label>
        <input id="id_password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
