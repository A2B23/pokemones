<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar Pokémon</title>
</head>
<body>
    <h1>Eliminar Pokémon</h1>

    <p>¿Seguro que quieres eliminar a <strong>{{ pokemon.nombre }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'pokemon:lista' %}">Cancelar</a>
    </form>
</body>
</html>
